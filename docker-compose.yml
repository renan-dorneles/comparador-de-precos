version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.5
    container_name: comparador-db
    environment:
      POSTGRES_DB: comparador_precos
      POSTGRES_USER: comparador_user
      POSTGRES_PASSWORD: comparador_pass
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: comparador-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build: .
    container_name: comparador-api
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://comparador_user:comparador_pass@db:5432/comparador_precos
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: secret-key-change-me-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pg_data: