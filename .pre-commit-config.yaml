# Pre-commit hooks configuration
# See https://github.com/pre-commit/pre-commit-hooks
# for more information about what this file does.
# Run "pre-commit install" to set up the hooks in your $GIT_DIR/.pre-commit-config.yaml

repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3.13

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        files: ^src/
        # O hook roda num venv isolado: sem as dependencias do projeto o
        # SQLAlchemy vira "Any" (disparando no-any-return) e o redis fica sem stubs.
        additional_dependencies:
          - sqlalchemy[asyncio]>=2.0.0
          - fastapi>=0.104.0
          - pydantic>=2.5.0
          - pydantic-settings>=2.1.0
          - email-validator>=2.0.0
          - geoalchemy2>=0.14.0
          - redis>=5.0.0
          - types-redis
          - asyncpg>=0.29.0
          - httpx>=0.25.0
          - python-jose[cryptography]>=3.3.0
          - bcrypt>=4.0.1
