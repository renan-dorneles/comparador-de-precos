# ============================================================
# pyproject.toml - Configuração moderna do projeto Python
# ============================================================

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comparador-de-precos"
version = "0.1.0"
description = "Comparador de Preços - Análise de dados e notebooks para comparação de preços"
readme = "README.md"
authors = [
    { name = "Usuário", email = "usuario@exemplo.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Data Analysis",
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "requests>=2.31.0",
    "fastapi>=0.104.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.12.0",
    "pydantic>=2.5.0",
    "geoalchemy2>=0.14.0",
    "httpx>=0.25.0",
    "psycopg2-binary>=2.9.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.1",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.26.0",
    "notebook>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
    "httpx>=0.25.0",
]
notebook = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.26.0",
    "notebook>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["comparador_precos*"]

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "BLE", "S", "RUF"]
ignore = [
    "E501",    # line length e controlado pelo black
    "B008",    # Depends() em defaults é o padrão idiomático do FastAPI
    "BLE001",  # fail-open intencional em serviços de infraestrutura (Redis)
    "S101",    # asserts são válidos em testes
    "SIM108",  # ternário é mais legível que if/else em alguns casos
    "RUF001",  # não corrigir ambiguidade de caracteres unicode em strings
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "SIM", "BLE"]
"alembic/*" = ["E402"]
# "bearer" e o tipo do token OAuth2, nao uma senha hardcoded
"src/comparador_precos/schemas/auth.py" = ["S105"]
"src/comparador_precos/api/routes/auth.py" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["comparador_precos"]

[tool.flake8]
max-line-length = 100
extend-ignore = "E203, W503"
exclude = ".git,__pycache__,.venv,build,dist"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"