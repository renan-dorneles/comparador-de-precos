# ============================================================
# alembic.ini
# ============================================================
# Alembic configuration file for Comparador de Preços

[alembic]
# path to migration scripts
script_location = alembic

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
timezone = America/Sao_Paulo

# max length of characters to apply to the version
# number generation.  Can be overridden manually.
# default is 10
version_length = 10

# charset encoding
# leave blank for default encoding
sqlalchemy.url = postgresql+asyncpg://comparador_user:comparador_pass@localhost:5432/comparador_precos

# template used to generate migration files
# The default is:
#   %(rev)s_%(slugify)s
version_locale = en_US
version_locale_encoding = utf-8
#version_code_template = %(rev)s_%(slugify)s

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated migration scripts.  See the documentation for further
# detail and examples
#post_write_hooks = hooks.filescript

# filescript format
#filescript = alembic_post_write_hook.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S